name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tutorpaes/frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tutorpaes/frontend/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: tutorpaes/frontend
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mvp_db
          POSTGRES_USER: tutorpaes_app
          POSTGRES_PASSWORD: tutorpaes_app
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tutorpaes/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend (in parallel)
        run: |
          cd ../../tutorpaes/backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          export DATABASE_URL="postgresql+psycopg://tutorpaes_app:tutorpaes_app@127.0.0.1:5432/mvp_db"
          export SECRET_KEY="ci-secret-key-1234567890"
          export PAYMENT_RETURN_URL="http://localhost:3000/api/payments/confirm"
          export ENVIRONMENT="test"
          # Run migrations
          alembic upgrade head
          # Start server in background
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
        timeout-minutes: 5
        continue-on-error: true

      - name: Build Next.js app
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BACKEND_URL: http://localhost:8000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tutorpaes/frontend/playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: tutorpaes/frontend/test-results/
          retention-days: 7
