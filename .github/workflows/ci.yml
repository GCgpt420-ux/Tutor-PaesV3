name: Unified CI

on:
  pull_request:
    paths:
      - "tutorpaes/backend/**"
      - "tutorpaes/frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "tutorpaes/backend/**"
      - "tutorpaes/frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-tests:
    name: Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorpaes/backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-1234567890"
      PAYMENT_RETURN_URL: "http://localhost:3000/api/payments/confirm"
      ENVIRONMENT: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tutorpaes/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: python -m pytest -q

  frontend-tests:
    name: Frontend Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorpaes/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tutorpaes/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx jest --no-coverage
