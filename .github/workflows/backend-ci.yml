name: Backend CI

on:
  pull_request:
    paths:
      - "tutorpaes/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "tutorpaes/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tutorpaes/backend

    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-1234567890"
      PAYMENT_RETURN_URL: "http://localhost:3000/api/payments/confirm"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tutorpaes/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-mock

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Compile source
        run: python -m compileall app scripts

      - name: Import application
        run: python -c "from app.main import app; print(app.title)"

      - name: Run tests
        run: python -m pytest -q